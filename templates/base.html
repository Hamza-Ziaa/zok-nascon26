<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ZOK{% endblock %} — Your Morning Paper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ── */
    :root {
      --sky-top: #D4C5F9;
      --sky-mid: #8FB4F8;
      --sky-warm: #F5C08B;
      --paper: #FAFAFA;
      --card: #FFFFFF;
      --ink: #1a1a2e;
      --mute: #6b7280;
      --accent: #4f46e5;
      --accent-light: #eef2ff;
      --gold: #d97706;
      --green: #059669;
      --red: #dc2626;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
      --shadow-lg: 0 4px 24px rgba(0,0,0,.10);
      --font-serif: 'Libre Baskerville', Georgia, serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --serif: var(--font-serif);
      --sans: var(--font-sans);
      --display: var(--font-serif);
      --line: #E2E8F0;
      --line-subtle: #F1F5F9;
      --ink-soft: #475569;
      --transition: .25s cubic-bezier(.4,0,.2,1);
    }


    /* ── Base ── */
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--ink); }
    img { max-width: 100%; display: block; }
    button, input, select, textarea {
      font-family: inherit; font-size: inherit; border: none; outline: none;
    }

    /* ── Nav ── */
    .zok-nav {
      position: absolute; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.25rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .zok-nav.nav-solid {
      position: sticky; top: 0;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .zok-logo {
      font-family: var(--font-serif);
      font-weight: 700; font-size: 1.5rem;
      color: var(--ink); letter-spacing: -0.02em;
    }
    .zok-logo span { color: var(--accent); }
    .zok-pills {
      display: flex; gap: .5rem; align-items: center;
      background: rgba(255,255,255,.35);
      border-radius: 999px; padding: .3rem;
      backdrop-filter: blur(8px);
    }
    .nav-solid .zok-pills {
      background: rgba(0,0,0,.04);
    }
    .zok-pills a {
      padding: .45rem 1rem;
      border-radius: 999px;
      font-size: .875rem; font-weight: 500;
      color: var(--ink); transition: all var(--transition);
      white-space: nowrap;
    }
    .zok-pills a:hover,
    .zok-pills a.active {
      background: var(--card);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      color: var(--accent);
    }
    .nav-hamburger {
      display: none; background: none; cursor: pointer;
      width: 36px; height: 36px; border-radius: 8px;
      align-items: center; justify-content: center;
    }
    .nav-hamburger svg { width: 22px; height: 22px; stroke: var(--ink); }

    /* ── Mobile Nav ── */
    @media (max-width: 640px) {
      .zok-nav { padding: 1rem 1.25rem; }
      .zok-pills { display: none; }
      .zok-pills.open {
        display: flex; flex-direction: column;
        position: absolute; top: 100%; right: 1rem;
        background: var(--card); border-radius: var(--radius);
        box-shadow: var(--shadow-lg); padding: .5rem;
        min-width: 160px;
      }
      .nav-hamburger { display: flex; }
    }

    /* ── Main ── */
    .zok-main { min-height: 100vh; }

    /* ── Footer ── */
    .zok-footer {
      text-align: center; padding: 3rem 1.5rem;
      color: var(--mute); font-size: .85rem;
    }
    .zok-footer a { color: var(--mute); }
    .zok-footer a:hover { color: var(--accent); }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.75rem;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .card-flat { box-shadow: none; border: 1px solid rgba(0,0,0,.06); }
    .card-flat:hover { box-shadow: var(--shadow); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .7rem 1.5rem; border-radius: 999px;
      font-weight: 600; font-size: .9rem;
      cursor: pointer; transition: all var(--transition);
      border: none;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover {
      background: #4338ca; color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79,70,229,.3);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(0,0,0,.12);
      color: var(--ink);
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .btn-ghost {
      background: transparent; color: var(--mute);
      padding: .5rem .75rem; font-size: .8rem;
    }
    .btn-ghost:hover { color: var(--accent); background: var(--accent-light); }
    .btn-sm { padding: .4rem 1rem; font-size: .8rem; }

    /* ── Forms ── */
    .form-field {
      display: flex; flex-direction: column; gap: .4rem;
    }
    .form-field label {
      font-size: .85rem; font-weight: 600; color: var(--ink);
    }
    .form-field input,
    .form-field textarea,
    .form-field select {
      padding: .7rem 1rem;
      border: 1.5px solid rgba(0,0,0,.1);
      border-radius: var(--radius-sm);
      background: var(--paper);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,70,229,.1);
    }
    .form-field textarea { resize: vertical; min-height: 100px; }

    /* ── Utilities ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
    .container-narrow { max-width: 720px; margin: 0 auto; padding: 0 1.5rem; }
    .text-center { text-align: center; }
    .text-mute { color: var(--mute); }
    .text-serif { font-family: var(--font-serif); }
    .text-serif-italic { font-family: var(--font-serif); font-style: italic; }
    .mt-1 { margin-top: .5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .mt-4 { margin-top: 2rem; }
    .mt-6 { margin-top: 3rem; }
    .mb-2 { margin-bottom: 1rem; }
    .mb-4 { margin-bottom: 2rem; }
    .gap-1 { gap: .5rem; }
    .gap-2 { gap: 1rem; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }

    /* ── Tag / Badge ── */
    .tag {
      display: inline-block; padding: .2rem .7rem;
      border-radius: 999px; font-size: .72rem;
      font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em;
    }
    .tag-topic { background: var(--accent-light); color: var(--accent); }
    .tag-thread { background: #fef3c7; color: var(--gold); }
    .tag-source { background: #f3f4f6; color: var(--mute); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-up {
      animation: fadeUp .6s cubic-bezier(.4,0,.2,1) both;
    }
    .animate-fade-in {
      animation: fadeIn .5s ease both;
    }
    .delay-1 { animation-delay: .1s; }
    .delay-2 { animation-delay: .2s; }
    .delay-3 { animation-delay: .3s; }
    .delay-4 { animation-delay: .4s; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--ink); color: #fff;
      padding: .75rem 1.5rem; border-radius: 999px;
      font-size: .85rem; font-weight: 500;
      opacity: 0; transition: all .35s cubic-bezier(.4,0,.2,1);
      z-index: 9999; pointer-events: none;
    }
    .toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* ── Error ── */
    .alert-error {
      background: #fef2f2; border: 1px solid #fecaca;
      color: var(--red); padding: .75rem 1rem;
      border-radius: var(--radius-sm); font-size: .85rem;
      margin-bottom: 1rem;
    }

    /* ── Responsive helpers ── */
    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
      .card { padding: 1.25rem; }
    }
    @media (min-width: 769px) {
      .hide-desktop { display: none !important; }
    }

    {% block extra_css %}{% endblock %}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block nav %}
  <nav class="zok-nav {% block nav_class %}nav-solid{% endblock %}">
    <a href="/" class="zok-logo">z<span>o</span>k</a>
    <button class="nav-hamburger" onclick="document.querySelector('.zok-pills').classList.toggle('open')" aria-label="Menu">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
      </svg>
    </button>
    <div class="zok-pills">
      {% block nav_links %}
      <a href="/paper">Today's Paper</a>
      <a href="/archive">Past Papers</a>
      <a href="/me">About You</a>
      <a href="/paper.pdf" target="_blank">PDF Broadsheet</a>
      <a href="/logout">Log out</a>
      {% endblock %}

    </div>
  </nav>
  {% endblock %}

  <main class="zok-main">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}
  <footer class="zok-footer">
    <p>Made with care by <strong>ZOK</strong> · Your morning, simplified.</p>
  </footer>
  {% endblock %}

  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg, ms = 2500) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    /* Close mobile nav on link click */
    document.querySelectorAll('.zok-pills a').forEach(a => {
      a.addEventListener('click', () => {
        document.querySelector('.zok-pills')?.classList.remove('open');
      });
    });

    {% block extra_js %}{% endblock %}
  </script>
</body>
</html>
