<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zok — The Personal Morning Broadside. Curated by Intelligence. Finite by Design.">
    <title>{% block title %}Zok — The Personal Morning Broadside{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'Georgia', 'serif'],
                        'newsreader': ['"Newsreader"', 'Georgia', 'serif'],
                        'garamond': ['"EB Garamond"', 'Georgia', 'serif'],
                        'inter': ['"Inter"', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        ink: {
                            900: '#121212',
                            800: '#2b2925',
                            700: '#4a463e',
                            600: '#737069',
                            400: '#a8a49c',
                        },
                        terracotta: '#943d24',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Editorial Serif & Clean Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Custom Luxury Stylesheet -->
    <link rel="stylesheet" href="/public/css/style.css">

    {% block head %}{% endblock %}
</head>
<body class="relative min-h-screen selection:bg-stone-200 selection:text-stone-900 pb-20 overflow-x-hidden">

    <!-- Painterly Morning Dawn Sky (Inspired by DUNA & Portal) -->
    <div class="dawn-sky-canvas" aria-hidden="true"></div>

    <!-- Minimalist Reading Progress Line -->
    <div id="reading-progress" style="width: 0%"></div>

    <!-- Main Container -->
    <main id="main-content" class="relative z-10 pt-4 sm:pt-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Scripts -->
    <script src="/public/js/animations.js"></script>
    <script src="/public/js/tracking.js"></script>
    <script src="/public/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
